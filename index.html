<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Açaí da Ray • Links</title>
  <meta name="description" content="Açaí da Ray — o melhor açaí da região. Localização, delivery e WhatsApp." />
  <meta name="theme-color" content="#14001f" />
  <link rel="icon" href="logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: { gold: '#e7b3a1', deep: '#c48b8f' },
            grape: { 950: '#0b0013', 900: '#14001f', 800: '#24063a', 700: '#3a0d5c' }
          },
          fontFamily: { sans: ['Outfit', 'sans-serif'], script: ['"Great Vibes"', 'cursive'] }
        }
      }
    }
  </script>
  <style>
    :root {
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html,
    body {
      background: #0b0013;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- FUNDO ---------- */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(70% 45% at 50% 0%, rgba(126, 46, 190, .55) 0%, transparent 70%),
        radial-gradient(60% 40% at 50% 18%, rgba(231, 179, 161, .16) 0%, transparent 70%),
        radial-gradient(80% 50% at 50% 110%, rgba(90, 20, 140, .45) 0%, transparent 70%),
        linear-gradient(180deg, #1a0030 0%, #12001d 40%, #0b0013 100%);
    }

    /* padrão sutil de bolinhas de açaí */
    .bg-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(231, 179, 161, .08) 1px, transparent 1.4px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 55%);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 55%);
    }

    /* ---------- ENTRADA ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      animation: fadeUp .9s var(--ease) forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ---------- LOGO (sem moldura) ---------- */
    .logo {
      filter: drop-shadow(0 0 18px rgba(231, 179, 161, .35)) drop-shadow(0 8px 30px rgba(126, 46, 190, .5));
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 14px rgba(231, 179, 161, .3)) drop-shadow(0 8px 30px rgba(126, 46, 190, .45));
      }

      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 26px rgba(231, 179, 161, .55)) drop-shadow(0 8px 40px rgba(126, 46, 190, .65));
      }
    }

    .text-rosegold {
      background: linear-gradient(100deg, #f7d9cc 0%, #e7b3a1 40%, #c48b8f 60%, #f7d9cc 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    /* ---------- CARDS ---------- */
    .card {
      transition: transform .3s var(--ease), box-shadow .3s var(--ease);
      box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .8);
    }

    .card:active {
      transform: scale(.96);
    }

    .card img {
      transition: transform 1.1s var(--ease);
    }

    .card:hover img,
    .card:active img {
      transform: scale(1.1);
    }

    .card:hover {
      box-shadow: 0 18px 44px -14px rgba(231, 179, 161, .35);
    }

    .card .icon {
      transition: background .3s, color .3s, transform .3s var(--ease);
    }

    .card:hover .icon,
    .card:active .icon {
      background: #e7b3a1;
      color: #14001f;
      transform: rotate(-8deg);
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body class="font-sans text-white antialiased min-h-screen">
  <div class="bg-scene" aria-hidden="true"></div>

  <main class="relative z-10 mx-auto w-full max-w-md px-4 pt-10 pb-10">

    <!-- Cabeçalho -->
    <header class="flex flex-col items-center text-center">
      <!-- .reveal fica no wrapper: a animação "breathe" da .logo sobrescreveria o fadeUp e a logo ficaria invisível -->
      <div class="reveal w-64 max-w-[78%]" style="animation-delay:.05s">
        <img src="logo.jpeg" alt="Açaí da Ray"
          class="logo block w-full h-auto rounded-[24px] border border-rose-gold/30"
          onerror="this.outerHTML='<h1 class=\'logo font-script text-7xl leading-[.9] text-rosegold\'>Açaí<br>da Ray</h1>'" />
      </div>

      <p class="reveal mt-4 text-[15px] text-white/75" style="animation-delay:.2s">O melhor açaí da região 💜</p>

      <div class="reveal mt-4 flex flex-wrap justify-center gap-2 text-[12px]" style="animation-delay:.3s">
        <span class="px-3 py-1 rounded-full bg-white/[.06] border border-rose-gold/25 text-white/80">🛵 Fazemos
          entregas</span>
        <span id="status" class="px-3 py-1 rounded-full bg-white/[.06] border border-rose-gold/25 text-white/80">🕒 Ter
          a Dom</span>
      </div>
    </header>

    <!-- Cards -->
    <nav class="mt-8 flex flex-col gap-4">

      <!-- 1. WhatsApp -->
      <a href="https://wa.me/message/UL2O6E25CBDCC1" target="_blank" rel="noopener"
        class="card reveal relative block h-48 rounded-[28px] overflow-hidden border border-rose-gold/20"
        style="animation-delay:.45s">
        <img src="card-wpp.jpeg" alt="" class="absolute inset-0 w-full h-full object-cover object-[center_40%]" />
        <div class="absolute inset-0 bg-gradient-to-t from-grape-950 via-grape-950/40 to-transparent"></div>
        <div class="absolute bottom-0 inset-x-0 p-5 flex items-end justify-between gap-3">
          <div>
            <p class="text-[11px] font-semibold tracking-[.18em] uppercase text-rose-gold">Atendimento principal</p>
            <h2 class="mt-0.5 text-[22px] font-bold leading-tight">WhatsApp</h2>
          </div>
          <span
            class="icon flex-shrink-0 w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-rose-gold/40 flex items-center justify-center text-rose-gold">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z" />
            </svg>
          </span>
        </div>
      </a>

      <!-- 2. Delivery -->
      <a href="https://restaurante.flashmenu.app/acai-da-ray" target="_blank" rel="noopener"
        class="card reveal relative block h-48 rounded-[28px] overflow-hidden border border-rose-gold/20"
        style="animation-delay:.58s">
        <img src="card-ray.jpeg" alt="" class="absolute inset-0 w-full h-full object-cover object-[center_35%]" />
        <div class="absolute inset-0 bg-gradient-to-t from-grape-950 via-grape-950/40 to-transparent"></div>
        <div class="absolute bottom-0 inset-x-0 p-5 flex items-end justify-between gap-3">
          <div>
            <p class="text-[11px] font-semibold tracking-[.18em] uppercase text-rose-gold">Delivery</p>
            <h2 class="mt-0.5 text-[22px] font-bold leading-tight">Pedidos Online</h2>
          </div>
          <span
            class="icon flex-shrink-0 w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-rose-gold/40 flex items-center justify-center text-rose-gold">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <circle cx="5.5" cy="17" r="3" />
              <circle cx="18.5" cy="17" r="3" />
              <path d="M8.5 17h6.5l-3-7H8M15 6h3l2.5 6M12 10h5" />
            </svg>
          </span>
        </div>
      </a>

      <!-- 3. Localização -->
      <a href="https://www.google.com/maps/search/?api=1&query=Rua+Arlinda+Ramos+Roleira%2C+305+-+Jardim+S%C3%A3o+Rafael%2C+S%C3%A3o+Paulo+-+SP"
        target="_blank" rel="noopener"
        class="card reveal relative block h-48 rounded-[28px] overflow-hidden border border-rose-gold/20"
        style="animation-delay:.71s">
        <img src="espaco.jpeg" alt="Espaço do Açaí da Ray"
          class="absolute inset-0 w-full h-full object-cover object-[center_42%]" />
        <div class="absolute inset-0 bg-gradient-to-t from-grape-950 via-grape-950/40 to-transparent"></div>
        <div class="absolute bottom-0 inset-x-0 p-5 flex items-end justify-between gap-3">
          <div>
            <p class="text-[11px] font-semibold tracking-[.18em] uppercase text-rose-gold">Venha nos visitar!</p>
            <h2 class="mt-0.5 text-[22px] font-bold leading-tight">Nossa Nova Unidade</h2>
            <p class="mt-1 text-[12.5px] leading-snug text-white/75">Rua Arlinda Ramos Roleira, 305<br>Jardim São Rafael
              · São Paulo/SP</p>
          </div>
          <span
            class="icon flex-shrink-0 w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-rose-gold/40 flex items-center justify-center text-rose-gold">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" />
              <circle cx="12" cy="9.5" r="2.5" />
            </svg>
          </span>
        </div>
      </a>
    </nav>

    <!-- Rodapé -->
    <footer class="reveal mt-10 flex flex-col items-center gap-3" style="animation-delay:.85s">
      <a href="https://instagram.com/acai_da_ray28" target="_blank" rel="noopener" aria-label="Instagram"
        class="w-11 h-11 rounded-full border border-rose-gold/40 bg-white/5 flex items-center justify-center text-rose-gold active:scale-90 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
        </svg>
      </a>
      <p class="text-[11px] tracking-[.2em] uppercase text-white/35">© <span id="y"></span> Açaí da Ray</p>
    </footer>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    // Mostra "Aberto agora" / "Fechado" conforme o horário (Ter–Qui 14–22h, Sex–Sáb 14–22h30, Dom 13–21h30)
    (function () {
      const h = { 0: [13 * 60, 21 * 60 + 30], 2: [14 * 60, 22 * 60], 3: [14 * 60, 22 * 60], 4: [14 * 60, 22 * 60], 5: [14 * 60, 22 * 60 + 30], 6: [14 * 60, 22 * 60 + 30] };
      const now = new Date(), d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
      const el = document.getElementById('status');
      if (h[d] && m >= h[d][0] && m < h[d][1]) {
        el.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>Aberto agora';
      } else {
        el.textContent = '🕒 Fechado agora';
      }
    })();
  </script>
</body>

</html>
